name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      compileSamples:
        description: "Cold compile samples per schema (median taken). 1 is default; 10-30 is thorough."
        required: false
        default: "10"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Record environment
        run: |
          {
            echo "## Benchmark environment"
            echo ""
            echo "- Date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Node: $(node -v)"
            echo "- npm: $(npm -v)"
            echo "- OS: $(uname -a)"
            echo "- CPU model: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
            echo "- CPU cores: $(nproc)"
            echo "- Memory: $(free -h | awk '/Mem:/ {print $2}')"
            echo ""
            echo "> Hosted runner: CPU frequency is NOT pinned and the VM is shared."
            echo "> Treat ratios (e.g. compile speedup) as stable; absolute ops/sec are hardware-dependent."
          } | tee env-info.md

      - name: Install dependencies
        run: npm ci

      # bench script runs `npm run build` itself unless SKIP_BUILD is set.
      - name: Run benchmark (Jet vs AJV)
        env:
          COMPILE_SAMPLES: ${{ inputs.compileSamples }}
        run: npm run bench

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmarks/results/comparison-latest.json
            benchmarks/results/comparison-report.md
            benchmarks/results/jet-latest.json
            benchmarks/results/ajv-latest.json
            env-info.md
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          cat env-info.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmarks/results/comparison-report.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat benchmarks/results/comparison-report.md >> "$GITHUB_STEP_SUMMARY"
          fi